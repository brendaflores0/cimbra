# Publica cimbratech.com en GitHub Pages.
# Antes de publicar genera el listado del blog y agrega los posts al sitemap
# (scripts/generar-blog.mjs), así los PRs de posts nuevos solo agregan su
# carpeta y su portada, y nunca chocan entre sí.
#
# Requiere: Settings → Pages → Source = "GitHub Actions".

name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copiar los archivos del sitio
        run: |
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'blog/_plantilla.html'

      - name: Generar listado del blog y sitemap
        run: node scripts/generar-blog.mjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
